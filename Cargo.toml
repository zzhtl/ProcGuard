[package]
name = "procguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Lightweight Linux desktop process manager"
publish = false

[dependencies]
# glow instead of the default wgpu: far lighter on llvmpipe/software GL; accesskit (zbus) and links are dropped.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.36.2", default-features = false }
# rustix, memmap2 and x11rb are already in winit's dependency tree; listing them only adds features.
rustix = { version = "1.1.5", features = ["process", "event", "fs", "param", "time"] }
memmap2 = "0.9.11"
x11rb = { version = "0.13.2", features = ["res"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
